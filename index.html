<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>1999 기록실</title>
  <meta name="description" content="리버스: 1999 개인 기록 — 캐릭터 육성, 갈기의 게시판, 스킨, 의지, 덱, 육성 계획, 모집 기록">
  <meta name="theme-color" content="#10201c">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <a class="skip" href="#main">본문으로 건너뛰기</a>
  <header class="masthead">
    <canvas class="rain" aria-hidden="true"></canvas>
    <div class="masthead-inner">
      <a class="brand" href="#/">
        <span class="brand-title" data-site-title>1999 기록실</span>
        <span class="brand-sub" data-site-sub>리버스: 1999 개인 기록</span>
      </a>
      <div class="masthead-actions">
        <button class="btn-save" type="button" data-save hidden>
          <span class="save-dot" aria-hidden="true"></span><span data-save-label>저장</span>
        </button>
        <button class="btn-edit" type="button" data-edit-toggle aria-pressed="false">편집</button>
      </div>
    </div>
    <nav class="tabs" aria-label="메뉴">
      <a href="#/" data-route="home">홈</a>
      <a href="#/roster" data-route="roster">캐릭터</a>
      <a href="#/bulletin" data-route="bulletin">갈기의 게시판</a>
      <a href="#/skins" data-route="skins">스킨</a>
      <a href="#/psychubes" data-route="psychubes">의지</a>
      <a href="#/decks" data-route="decks">덱</a>
      <a href="#/plans" data-route="plans">육성 계획</a>
      <a href="#/gacha" data-route="gacha">모집 기록</a>
      <a href="#/names" data-route="names" data-names-tab hidden>다국어 이름표</a>
      <a href="#/settings" data-route="settings">설정</a>
    </nav>
  </header>

  <main id="main" tabindex="-1">
    <p class="loading">기록을 불러오는 중…</p>
  </main>

  <footer class="site-foot">
    <p>
      팬이 만든 개인 기록 사이트입니다. 게임 이미지와 데이터의 권리는 Bluepoch에 있습니다.
      데이터 출처: <a href="https://github.com/St-Pavlov-Foundation/re1999-data-global">re1999-data-global</a>,
      <a href="https://github.com/myssal/Reverse-1999-CN-Asset">Reverse-1999-CN-Asset</a>,
      <a href="https://github.com/windbow27/kornblume">Kornblume</a>,
      <a href="https://github.com/UnderLotus/r1999-roster">r1999-roster</a>,
      <a href="https://reverse1999.fandom.com">Reverse: 1999 Wiki</a>.
    </p>
    <p data-game-updated></p>
  </footer>

  <div class="toast-zone" aria-live="polite"></div>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
