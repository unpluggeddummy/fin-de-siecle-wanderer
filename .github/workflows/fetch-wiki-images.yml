# 위키 원본 화질로 배너·포스터 다시 받기 (연대기·스토리 배너·모집 배너·의상 포스터)
# Actions 탭에서 직접 실행한다. 내 기록(data/user)은 건드리지 않는다.
name: 위키 고화질 그림 받기

on:
  workflow_dispatch:
    inputs:
      redo:
        description: "받았던 그림도 모두 다시 받기 (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: fetch-wiki-images
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow requests
      - name: 원본 그림 받기
        run: python3 scripts/fetch_wiki_images.py ${{ github.event.inputs.redo == 'true' && '--all' || '' }}
      - name: 저장소에 올리기
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img data/raw/wiki/images-done.json
          if git diff --cached --quiet; then echo "바뀐 것 없음"; exit 0; fi
          git commit -m "위키 원본 화질 그림 받기"
          git pull --rebase
          git push
