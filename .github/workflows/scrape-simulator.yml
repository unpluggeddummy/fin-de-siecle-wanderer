# 시뮬레이터 사이트(reverse1999-simulator.com)와 팬덤 위키의 출품작·스킨 정보를 받아 data/raw 에 저장
# Actions 탭 → "시뮬레이터 정보 받기" → Run workflow 로 실행한다.
name: 시뮬레이터·위키 정보 받기

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 브라우저 준비
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: 시뮬레이터 페이지 읽기
        continue-on-error: true
        run: node scripts/scrape_simulator.mjs data/raw/simulator
      - name: 팬덤 위키 문서 받기
        continue-on-error: true
        run: node scripts/scrape_fandom.mjs data/raw/fandom
      - name: 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw
          if git diff --cached --quiet; then echo "바뀐 내용 없음"; exit 0; fi
          git commit -m "시뮬레이터 정보 받기 ($(date -u +%Y-%m-%d))"
          for i in 1 2 3; do git pull --rebase --autostash && git push && exit 0; sleep 5; done
          exit 1
